# ---------------------------------------------------------------------
# Geografía. puntaje: 1.0 = zona prioritaria.
# ---------------------------------------------------------------------
geografia:
  region_por_defecto: "Medellín, Antioquia, Colombia"
  centro: {lat: 6.2442, lng: -75.5812}
  radio_m: 20000
  ciudades:
    "Medellín": 1.0
    "Envigado": 0.85
    "Sabaneta": 0.85
    "Itagüí": 0.8
    "Bello": 0.75
    "La Estrella": 0.7
    "Caldas": 0.6
    "Copacabana": 0.6
    "Girardota": 0.55
    "Barbosa": 0.5
