  puntaje_resto_colombia: 0.2
  puntaje_otro_pais: 0.1

# ---------------------------------------------------------------------
# Calificación (0–100). Pesos configurables por servicio objetivo.
# ---------------------------------------------------------------------
calificacion:
  pesos_por_defecto:
    icp: 25
    necesidad: 25
    capacidad: 15
    accesibilidad: 15
    crecimiento: 10
    geografia: 10
  pesos_por_servicio:
    # Para vender acompañamiento mensual pesa más la capacidad de pago.
    acompanamiento_mensual: {icp: 20, necesidad: 25, capacidad: 25, accesibilidad: 10, crecimiento: 10, geografia: 10}
    # Para control de caja pesan más las señales de volumen/crecimiento.
    control_caja: {icp: 25, necesidad: 25, capacidad: 15, accesibilidad: 10, crecimiento: 15, geografia: 10}
  clasificacion:
    - {min: 80, nombre: "Prospecto prioritario"}
    - {min: 60, nombre: "Prospecto interesante"}
    - {min: 40, nombre: "Prospecto para investigar"}
    - {min: 0, nombre: "Baja prioridad"}

# ---------------------------------------------------------------------
# Contacto y cumplimiento (Ley 1581 de 2012)
# ---------------------------------------------------------------------
contacto:
  finalidad: >-
    Prospección comercial B2B: ofrecer servicios de análisis financiero y de
    costos a establecimientos de comercio, usando solo canales de contacto
    empresariales publicados por el propio negocio.
  dias_entre_contactos: 7
  max_intentos_sin_respuesta: 3
  # Pasado este tiempo sin actividad, los prospectos descartados se borran.
  dias_retencion_descartados: 180
  dias_retencion_sin_contacto: 365
  # Orden de preferencia de canal (Mapa: visitas, WhatsApp, Instagram)
  canales_preferidos: [whatsapp, visita, instagram, correo, telefono, linkedin]
